name: 不具合の報告
description: FvNeo の動作がおかしいときに使います
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。分かる範囲でご記入ください。
        **フォルダ名やファイル名などの個人的な情報は、書かないでください。**（必要なら、伏せ字にしてください）
  - type: input
    id: version
    attributes:
      label: FvNeo のバージョン
      description: ［ヘルプ］－［バージョン情報］で確認できます。
      placeholder: "例: 1.00"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows のバージョン
      placeholder: "例: Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: どうなりましたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現する手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本来はどうなってほしいか
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: ログ（任意）
      description: |
        `%APPDATA%\FvNeo\fvneo.log` の関連部分です。**ファイル名やフォルダ名などの個人的な情報が含まれることがあります。内容を確認し、伏せてから貼ってください。**
      render: text
    validations:
      required: false
